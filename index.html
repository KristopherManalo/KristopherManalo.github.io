<!DOCTYPE html>
<html>
<head>
  <title>Location</title>    
  <link rel="stylesheet" href="styles.css">
  <script src="components/header.js" defer></script>
  
  
</head>
<body>
  <main-header></main-header>
  
  <!-- Webhook Handler Component -->
  <webhook-handler></webhook-handler>
  
  <button id="fetchBtn">test</button>
  <p id="result"></p>

  <script>
    document.getElementById("fetchBtn").addEventListener("click", () => {
      const resultParagraph = document.getElementById('result');
      resultParagraph.innerText = "getting owo";

        const url = "https://27irlz5j37nkz2pnm4j2f52ely0inpth.lambda-url.us-east-2.on.aws/";

        fetch(url, {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json'
          },
          body: JSON.stringify({ userClick: true })
        })
        .then(response => {
          if (!response.ok) {
              throw new Error('Network did not respond :(');
          }
          return response.json();
        })
        .then(data => {
          resultParagraph.innerText = data.message
        })
        .catch(error => {
          console.error("Error:", error);
          resultParagraph.innerText = "Failed to communicate with backend D:";
        });
      });
  </script>
</body>
</html>
